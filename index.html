<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Наш слот 💖</title>
  <!-- ?v= меняй при каждом обновлении, чтобы Telegram не брал старые файлы из кеша -->
  <link rel="stylesheet" href="style.css?v=15" />
  <!-- Telegram Web App SDK: нужен для работы внутри Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="kicker">наш вечер</p>
      <h1 class="title">Слот-удача</h1>
    </header>

    <!-- Три барабана: в каждом видно три символа, центральный — выигрышный -->
    <section class="machine" id="machine">
      <div class="reels">
        <div class="reel">
          <img class="cell" alt="" src="assets/prizes/candy.svg?v=14" />
          <img class="cell mid" alt="" src="assets/prizes/candy.svg?v=14" />
          <img class="cell" alt="" src="assets/prizes/candy.svg?v=14" />
        </div>
        <div class="reel">
          <img class="cell" alt="" src="assets/prizes/candy.svg?v=14" />
          <img class="cell mid" alt="" src="assets/prizes/candy.svg?v=14" />
          <img class="cell" alt="" src="assets/prizes/candy.svg?v=14" />
        </div>
        <div class="reel">
          <img class="cell" alt="" src="assets/prizes/candy.svg?v=14" />
          <img class="cell mid" alt="" src="assets/prizes/candy.svg?v=14" />
          <img class="cell" alt="" src="assets/prizes/candy.svg?v=14" />
        </div>
      </div>
    </section>

    <button id="spin" class="spin-btn" type="button">
      <svg class="spin-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66" />
        <path d="M20 4v5h-5" />
      </svg>
      <span>Крутить</span>
    </button>

    <p id="result" class="result hidden" role="status"></p>

    <p class="counter">Спин <span id="counter">1</span> из <span id="total"></span></p>

    <section class="prizes-card" aria-labelledby="prizes-title">
      <div class="prizes-head">
        <svg class="gift-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="8" width="18" height="4" rx="1" />
          <path d="M5 12v8h14v-8" />
          <path d="M12 8v12" />
          <path d="M12 8c-2-4-6-4-6-1.5S10 8 12 8zM12 8c2-4 6-4 6-1.5S14 8 12 8z" />
        </svg>
        <h2 id="prizes-title" class="prizes-title">Возможные призы</h2>
      </div>
      <div id="prize-grid" class="prize-grid"></div>
    </section>
  </main>

  <!-- Окно выигрыша -->
  <div id="win" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="modal-card">
      <div class="modal-glow" aria-hidden="true"></div>
      <img id="win-icon" class="win-icon" alt="" src="" />
      <h2 id="win-title" class="win-title">Поздравляю!</h2>
      <p class="win-prize">Ты выиграла: <strong id="win-prize"></strong></p>
      <p id="win-note" class="win-note"></p>
      <button id="win-close" class="win-close" type="button">Ура!</button>
    </div>
  </div>

  <script src="schedule.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
